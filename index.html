<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <script>
      // Apply the cached theme before first paint to avoid a flash of the wrong
      // theme; src/theme/useThemeEffect.ts keeps this key in sync going forward.
      (function () {
        try {
          var theme = localStorage.getItem('langtrainer:theme') || 'system';
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (_e) {
          /* ignore (e.g. storage disabled) */
        }
      })();
    </script>
    <meta name="description" content="LangTrainer — daily language-learning sessions, offline-first." />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>LangTrainer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
